name: Deployment
on:
  push:
    branches: [main]

jobs:
  Deploy:
  name:Deploy
  runs-on:ubuntu-latest
  
steps:

  - name: checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Build application
    run: npm run build
   
